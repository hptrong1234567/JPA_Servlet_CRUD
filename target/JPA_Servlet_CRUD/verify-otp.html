<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác nhận OTP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .otp-container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 45px 40px;
            width: 100%;
            max-width: 420px;
        }
        .otp-container:hover { transform: translateY(-5px); }
        .otp-header { text-align: center; margin-bottom: 30px; }
        .otp-header .icon { font-size: 48px; color: #667eea; margin-bottom: 8px; }
        .otp-header h2 { font-size: 26px; font-weight: 700; color: #333; }
        .otp-header p { color: #888; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; font-size: 14px; color: #444; margin-bottom: 5px; }
        .input-wrapper { position: relative; }
        .input-wrapper .input-icon {
            position: absolute; left: 14px; top: 50%;
            transform: translateY(-50%); color: #aaa; font-size: 16px;
        }
        .input-wrapper input {
            width: 100%; padding: 13px 16px 13px 46px;
            border: 2px solid #e8e8e8; border-radius: 12px;
            font-size: 15px; background: #f8f9fa; outline: none;
            transition: all 0.3s ease;
        }
        .input-wrapper input:focus {
            border-color: #667eea; background: #ffffff;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }
        .btn-verify {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 12px;
            font-size: 17px; font-weight: 600; cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-verify:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4); }
        .login-footer { text-align: center; margin-top: 25px; padding-top: 20px; border-top: 1px solid #f0f0f0; }
        .login-footer a { color: #667eea; text-decoration: none; font-weight: 600; }
        .login-footer a:hover { color: #764ba2; text-decoration: underline; }
        .alert { padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; display: none; font-weight: 500; }
        .alert-danger { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; display: block; }
        .alert-success { background: #dcfce7; color: #16a34a; border: 1px solid #86efac; display: block; }
        .resend-link { text-align: center; margin-top: 15px; }
        .resend-link a { color: #667eea; font-size: 14px; text-decoration: none; }
        .resend-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="otp-container">
        <div class="otp-header">
            <div class="icon"><i class="fas fa-shield-alt"></i></div>
            <h2>🔐 Xác nhận OTP</h2>
            <p>Nhập mã OTP đã được gửi đến email của bạn</p>
        </div>

        <div id="alert" class="alert alert-danger" style="display: none;"></div>

        <form action="verify-otp" method="post">
            <div class="form-group">
                <label>Email <span style="color: red;">*</span></label>
                <div class="input-wrapper">
                    <span class="input-icon"><i class="fas fa-envelope"></i></span>
                    <input type="email" name="email" placeholder="Nhập email đã đăng ký" required>
                </div>
            </div>
            <div class="form-group">
                <label>Mã OTP <span style="color: red;">*</span></label>
                <div class="input-wrapper">
                    <span class="input-icon"><i class="fas fa-key"></i></span>
                    <input type="text" name="otp" placeholder="Nhập mã 6 số" maxlength="6" required>
                </div>
            </div>
            <button type="submit" class="btn-verify">
                <i class="fas fa-check-circle"></i> Xác nhận
            </button>
        </form>

        <div class="resend-link">
            <a href="register.html">🔄 Đăng ký lại để nhận OTP mới</a>
        </div>

        <div class="login-footer">
            <p>Đã có tài khoản? <a href="Login.html">Đăng nhập</a></p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const alertMsg = urlParams.get('alert');
        const alertDiv = document.getElementById('alert');

        if (alertMsg) {
            alertDiv.textContent = decodeURIComponent(alertMsg);
            alertDiv.style.display = 'block';
            setTimeout(function() {
                alertDiv.style.display = 'none';
            }, 5000);
        }
    </script>

</body>
</html>
