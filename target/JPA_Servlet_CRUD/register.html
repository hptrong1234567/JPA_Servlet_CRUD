<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu</title>
    <script src="${pageContext.request.contextPath}/js/validation.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
        }
        .header { text-align: center; margin-bottom: 35px; }
        .header h2 { font-size: 28px; font-weight: 700; color: #333; }
        .header p { color: #888; font-size: 14px; margin-top: 5px; }
        .form-group { margin-bottom: 22px; }
        .form-group label { display: block; font-weight: 600; font-size: 14px; color: #555; margin-bottom: 6px; }
        .form-group input {
            width: 100%; padding: 14px 16px;
            border: 2px solid #e8e8e8; border-radius: 12px;
            font-size: 15px; background: #f8f9fa; outline: none;
            transition: all 0.3s ease;
        }
        .form-group input:focus {
            border-color: #667eea; background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }
        .error-message {
            color: #dc2626;
            font-size: 13px;
            margin-top: 5px;
            padding: 5px 10px;
            background: #fee2e2;
            border-radius: 6px;
            border-left: 4px solid #dc2626;
            display: none;
        }
        .btn-submit {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 12px;
            font-size: 17px; font-weight: 600; cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4); }
        .footer { text-align: center; margin-top: 25px; padding-top: 20px; border-top: 1px solid #f0f0f0; }
        .footer a { color: #667eea; text-decoration: none; font-weight: 600; }
        .alert { padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; display: none; }
        .alert-danger { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; display: block; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>🔄 Đặt lại mật khẩu</h2>
            <p>Nhập mã OTP và mật khẩu mới</p>
        </div>

        <div id="alert" class="alert alert-danger" style="display: none;"></div>

        <form action="reset-password" method="post" id="resetForm" onsubmit="return validateResetPassword()">
            <div class="form-group">
                <label>Email <span style="color: red;">*</span></label>
                <input type="email" id="email" name="email" placeholder="Nhập email đã đăng ký">
                <div id="emailError" class="error-message"></div>
            </div>
            <div class="form-group">
                <label>Mã OTP <span style="color: red;">*</span></label>
                <input type="text" id="otp" name="otp" placeholder="Nhập mã OTP" maxlength="6">
                <div id="otpError" class="error-message"></div>
            </div>
            <div class="form-group">
                <label>Mật khẩu mới <span style="color: red;">*</span></label>
                <input type="password" id="newPassword" name="newPassword" placeholder="Nhập mật khẩu mới (tối thiểu 6 ký tự)">
                <div id="passwordError" class="error-message"></div>
            </div>
            <div class="form-group">
                <label>Xác nhận mật khẩu <span style="color: red;">*</span></label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Nhập lại mật khẩu mới">
                <div id="confirmError" class="error-message"></div>
            </div>
            <button type="submit" class="btn-submit">💾 Đặt lại mật khẩu</button>
        </form>

        <div class="footer">
            <p><a href="Login.html">Quay lại đăng nhập</a></p>
        </div>
    </div>

    <script>
        var urlParams = new URLSearchParams(window.location.search);
        var alertMsg = urlParams.get('alert');
        var alertDiv = document.getElementById('alert');

        if (alertMsg) {
            alertDiv.textContent = decodeURIComponent(alertMsg);
            alertDiv.style.display = 'block';
        }

        function validateResetPassword() {
            var email = document.getElementById('email').value;
            var otp = document.getElementById('otp').value;
            var newPassword = document.getElementById('newPassword').value;
            var confirmPassword = document.getElementById('confirmPassword').value;
            var isValid = true;

            resetErrors(['emailError', 'otpError', 'passwordError', 'confirmError']);

            if (isEmpty(email)) {
                showError('emailError', '⚠️ Vui lòng nhập email!');
                isValid = false;
            } else if (!isValidEmail(email)) {
                showError('emailError', '⚠️ Email không đúng định dạng!');
                isValid = false;
            }

            if (isEmpty(otp) || otp.length !== 6) {
                showError('otpError', '⚠️ Vui lòng nhập đúng mã OTP 6 số!');
                isValid = false;
            }

            if (isEmpty(newPassword)) {
                showError('passwordError', '⚠️ Vui lòng nhập mật khẩu mới!');
                isValid = false;
            } else if (!minLength(newPassword, 6)) {
                showError('passwordError', '⚠️ Mật khẩu phải có ít nhất 6 ký tự!');
                isValid = false;
            }

            if (newPassword !== confirmPassword) {
                showError('confirmError', '⚠️ Mật khẩu xác nhận không khớp!');
                isValid = false;
            }

            return isValid;
        }
    </script>

</body>
</html>
